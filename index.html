<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación de Documento | Lic. Damián Capuzzi</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
    .card { max-width: 520px; margin: 15px auto; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); overflow: hidden; border: 1px solid #e2e8f0; }
    .header { background: #0f172a; color: #ffffff; padding: 22px 20px; text-align: center; }
    .header h1 { margin: 0; font-size: 17px; letter-spacing: 0.5px; }
    .header p { margin: 5px 0 0; font-size: 13px; color: #94a3b8; }
    .badge { display: inline-block; background: #dcfce7; color: #166534; font-weight: bold; font-size: 12px; padding: 4px 12px; border-radius: 20px; margin-top: 10px; border: 1px solid #bbf7d0; }
    .content { padding: 22px; }
    .receta-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: #0f172a; }
    .footer { padding: 15px 22px 22px; text-align: center; border-top: 1px solid #f1f5f9; }
    .btn { display: inline-block; background: #0284c7; color: #ffffff; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-size: 13px; font-weight: bold; }
    .legal { font-size: 11px; color: #64748b; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>DOCUMENTO OFICIAL VALIDADO</h1>
      <p>Lic. Damián Capuzzi | MN: 84718 - MP: 86942</p>
      <div class="badge">✓ Autenticidad Verificada</div>
    </div>
    <div class="content">
      <div id="cuerpoOrden" class="receta-box">Cargando datos del documento...</div>
    </div>
   <div class="footer">
      <a href="mailto:dcapuzzi@outlook.com" class="btn">Contactar al profesional</a>
      <div class="legal">Validación de seguridad antifraude emitida por el profesional tratante.</div>
    </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const texto = params.get('texto');
    const cont = document.getElementById('cuerpoOrden');
    if (texto) {
      cont.textContent = texto;
    } else {
      cont.textContent = "No se recibieron datos para validar en este documento.";
    }
  </script>
</body>
</html>
